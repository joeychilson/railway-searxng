# SearXNG configuration for a private, agent-facing instance.
#
# The secret key is NOT set here — it comes from the SEARXNG_SECRET
# environment variable, which SearXNG reads natively. The instance refuses
# to start without it.
#
# Engine notes: SearXNG scrapes most general engines, and datacenter IPs
# (Railway runs on GCP) get CAPTCHA'd or rate-limited by some of them —
# Google is disabled for that reason. Startpage and Mojeek were dropped after
# upstream marked them inactive (Proof-of-Work captcha). A diverse set of
# general engines is enabled so a single engine blocking doesn't empty the
# results. API-backed engines (wikipedia, github, arxiv, pypi, ...) are
# reliable from any IP.
# Check /stats on a running instance to see which engines are erroring.

# Start from upstream defaults for non-engine settings, but keep only the
# engines this template advertises. Without keep_only, SearXNG also enables
# dozens of unlisted default engines.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - qwant
      - wikipedia
      - wikidata
      - currency
      - github
      - gitlab
      - stackoverflow
      - mdn
      - hackernews
      - arch linux wiki
      - npm
      - pypi
      - crates.io
      - pkg.go.dev
      - docker hub
      - arxiv
      - semantic scholar
      - crossref
      - pubmed

general:
  instance_name: "SearXNG"

server:
  # Private instance: no bot detection / rate limiting. Do not expose this
  # publicly with the limiter off.
  limiter: false
  public_instance: false
  # GET keeps the API usable with plain query strings (curl, http clients).
  method: "GET"

search:
  safe_search: 0
  default_lang: "en"
  autocomplete: ""
  # json is what agents consume; html is kept so the web UI works for
  # debugging (removing it 403s the root page).
  formats:
    - html
    - json
  max_page: 5

outgoing:
  # SearXNG waits for the slowest engine, so these bound response latency.
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  retries: 1

engines:
  # --- General (category: general — the default for /search) ---
  # Explicitly enable every curated engine. Some are disabled in upstream's
  # defaults, so weights alone are not enough to turn them on.
  - name: duckduckgo
    shortcut: ddg
    disabled: false
    weight: 1.3
  - name: brave
    shortcut: br
    disabled: false
    weight: 1.3
  - name: qwant
    shortcut: qw
    disabled: false
    weight: 1.0
  - name: wikipedia
    shortcut: wp
    disabled: false
    weight: 1.2
  - name: wikidata
    shortcut: wd
    disabled: false
    weight: 0.7
  - name: currency
    disabled: false
    weight: 1.0

  # --- Developer (categories: it / q&a / packages — pass categories=it) ---
  - name: github
    shortcut: gh
    disabled: false
    weight: 1.2
  - name: gitlab
    shortcut: gl
    disabled: false
    weight: 0.8
  - name: stackoverflow
    shortcut: so
    disabled: false
    weight: 1.2
  - name: mdn
    shortcut: mdn
    disabled: false
    weight: 1.0
  - name: hackernews
    shortcut: hn
    disabled: false
    weight: 0.8
  - name: arch linux wiki
    shortcut: aw
    disabled: false
    weight: 0.8
  - name: npm
    shortcut: npm
    disabled: false
    weight: 0.8
  - name: pypi
    shortcut: pypi
    disabled: false
    weight: 0.8
  - name: crates.io
    shortcut: crates
    disabled: false
    weight: 0.8
  - name: pkg.go.dev
    shortcut: gopkg
    disabled: false
    weight: 0.8
  - name: docker hub
    shortcut: dh
    disabled: false
    weight: 0.8

  # --- Academic (category: science — pass categories=science) ---
  - name: arxiv
    shortcut: arx
    disabled: false
    weight: 1.5
  - name: semantic scholar
    shortcut: ss
    disabled: false
    weight: 1.0
  - name: crossref
    shortcut: cr
    disabled: false
    weight: 0.8
  - name: pubmed
    shortcut: pm
    disabled: false
    weight: 0.8
